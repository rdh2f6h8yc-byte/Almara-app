<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#0B1F3A">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ALMARA Prospección">
<link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/base.css">
<title>Prospección · ALMARA</title>
<style>
.contadores{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:2px 0 8px}
.contadores button{min-width:0;background:#fff;border:1px solid var(--borde);border-radius:12px;padding:8px 10px;text-align:left}
.contadores button b{display:block;font-size:20px;letter-spacing:-.02em;line-height:1.1}
.contadores button small{display:block;color:var(--gris);font-size:11px;font-weight:700;line-height:1.25;margin-top:3px}
.contadores button.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.contadores button.on small{color:#B8C7DA}
.lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gris);margin:8px 2px 0}
.buscar{margin:4px 0 2px}
.emp{display:block;width:100%;text-align:left;cursor:pointer}
.emp .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.emp .top b{font-size:15.5px;line-height:1.3}
.emp small{display:block;color:var(--gris);font-size:12.5px;margin-top:3px}
.emp .tag{margin:1px 0 0;flex:none}
.resumen{color:var(--gris);font-size:12.5px;margin:8px 2px 4px}
.dato{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--claro);font-size:14.5px}
.dato:first-child{border-top:0}
.dato span{color:var(--gris);flex:none}
.dato b{text-align:right;font-weight:650;overflow-wrap:anywhere}
.dato.largo{display:block}
.dato.largo b{display:block;text-align:left;margin-top:3px;font-weight:600;white-space:pre-wrap}
.vacio-campo{color:var(--gris);font-weight:600}
.acc{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.acc a{font-size:13px;font-weight:700;padding:9px 12px;border-radius:10px;background:var(--claro)}
.acc a.pri{background:var(--azul);color:#fff}
@media(min-width:760px){
  .contadores{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<header><a class="ib" href="/" id="bAtras">⌂</a><div class="tit"><small>ALMARA · PROSPECCIÓN</small><b id="titulo">Prospección</b></div></header>
<main id="main"><div class="vacio">Cargando…</div></main>
<script src="/config.js"></script><script src="/nube.js"></script>
<script>
"use strict";
if(!Nube.requerir()||!Nube.soloAdmin())throw new Error("Solo el administrador");
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const ESTADOS=["Sin contactar","Borrador en Gmail","Contactado","Respondió","Interesado","Presupuesto enviado","Cliente","Descartado"];
const EST_TAG={"Sin contactar":"","Borrador en Gmail":"a","Contactado":"a","Respondió":"n","Interesado":"n","Presupuesto enviado":"a","Cliente":"v","Descartado":"r"};
const SEG_TAG={"Rural":"v","Naves y polígonos":"a"};
let L=[],actualizado="",filtroEst="",filtroSeg="",filtroProv="",busq="",vista="";
const porId=id=>L.find(e=>e.id===id);
function fecha(f){if(!f)return "";const d=new Date(f+"T12:00:00");return isNaN(d)?f:d.toLocaleDateString("es-ES")}
function lugar(e){return [e.localidad,e.comarca,e.provincia].filter(Boolean).join(" · ")}
function webHref(w){const s=String(w||"").trim();if(!s)return "";return /^https?:\/\//i.test(s)?s:"https://"+s}
function telHref(t){return String(t||"").replace(/[^\d+]/g,"")}
function estados(){const extra=[];for(const e of L)if(e.estado&&!ESTADOS.includes(e.estado)&&!extra.includes(e.estado))extra.push(e.estado);return ESTADOS.concat(extra)}
function segmentos(){const s=[];for(const e of L)if(e.segmento&&!s.includes(e.segmento))s.push(e.segmento);return s}
function provincias(){const s=[];for(const e of L)if(e.provincia&&!s.includes(e.provincia))s.push(e.provincia);return s.sort((a,b)=>a.localeCompare(b,"es"))}
function coincide(e,conEstado){const q=norm(busq.trim());
  return (!conEstado||!filtroEst||e.estado===filtroEst)&&(!filtroSeg||e.segmento===filtroSeg)&&(!filtroProv||e.provincia===filtroProv)&&(!q||norm(e.nombre).includes(q))}
function filtradas(){return L.filter(e=>coincide(e,true)).slice().sort((a,b)=>String(a.nombre).localeCompare(b.nombre,"es"))}
function campo(etiq,valor,largo){const v=String(valor??"").trim();
  return `<div class="dato${largo?" largo":""}"><span>${etiq}</span><b>${v?esc(v):`<span class="vacio-campo">—</span>`}</b></div>`}
function tagEstado(estado){return `<span class="tag ${EST_TAG[estado]||""}">${esc(estado||"Sin estado")}</span>`}
function pintar(){if(vista)pintarDetalle();else pintarLista()}
function pintarLista(){$("bAtras").textContent="⌂";$("bAtras").setAttribute("href","/");$("titulo").textContent="Prospección";
  const foco=document.activeElement&&document.activeElement.id==="q",pos=foco?document.activeElement.selectionStart:null;
  const F=filtradas(),n=e=>L.filter(x=>x.estado===e&&coincide(x,false)).length;
  let h=`<div class="contadores" role="group" aria-label="Por estado">${estados().map(e=>`<button type="button" data-est="${esc(e)}" class="${filtroEst===e?"on":""}" aria-pressed="${filtroEst===e}"><b>${n(e)}</b><small>${esc(e)}</small></button>`).join("")}</div>
  <input class="buscar" id="q" type="search" enterkeyhint="search" placeholder="Buscar por nombre" value="${esc(busq)}" autocomplete="off">
  <div class="lbl">Segmento</div><div class="chips"><button type="button" data-seg="" class="${filtroSeg===""?"on":""}">Todos</button>${segmentos().map(s=>`<button type="button" data-seg="${esc(s)}" class="${filtroSeg===s?"on":""}">${esc(s)}</button>`).join("")}</div>
  <div class="lbl">Provincia</div><div class="chips"><button type="button" data-prov="" class="${filtroProv===""?"on":""}">Todas</button>${provincias().map(p=>`<button type="button" data-prov="${esc(p)}" class="${filtroProv===p?"on":""}">${esc(p)}</button>`).join("")}</div>
  <p class="resumen">${F.length===L.length?L.length+" empresa"+(L.length===1?"":"s"):F.length+" de "+L.length+(L.length===1?" empresa":" empresas")}${actualizado?" · actualizado "+fecha(actualizado):""}</p>`;
  if(!L.length)h+=`<div class="vacio">Todavía no hay empresas en prospección.</div>`;
  else if(!F.length)h+=`<div class="vacio">Ninguna empresa con ese filtro.</div>`;
  for(const e of F){const sitio=lugar(e);
    h+=`<button type="button" class="card emp" data-id="${esc(e.id)}"><div class="top"><b>${esc(e.nombre)}</b>${tagEstado(e.estado)}</div>
    <small>${esc([e.segmento,sitio].filter(Boolean).join(" · "))}</small>
    ${e.email?`<small>${esc(e.email)}</small>`:""}${e.servicio?`<small>${esc(e.servicio)}</small>`:""}</button>`}
  $("main").innerHTML=h;
  if(foco){const b=$("q");b.focus();if(pos!=null)b.setSelectionRange(pos,pos)}}
function pintarDetalle(){const e=porId(vista);
  $("bAtras").textContent="‹";$("bAtras").setAttribute("href","/prospeccion/");
  if(!e){$("titulo").textContent="Prospección";$("main").innerHTML=`<div class="vacio">No está esta empresa.</div>`;return}
  $("titulo").textContent=e.nombre;
  const web=webHref(e.web),tel=telHref(e.telefono);
  let h=`<div style="margin:2px 0 8px">${e.segmento?`<span class="tag ${SEG_TAG[e.segmento]||""}">${esc(e.segmento)}</span>`:""}${tagEstado(e.estado)}</div>`;
  if(e.email||tel||web)h+=`<div class="acc">${tel?`<a class="pri" href="tel:${esc(tel)}">📞 Llamar</a>`:""}${e.email?`<a class="pri" href="mailto:${esc(e.email)}">✉️ Email</a>`:""}${web?`<a href="${esc(web)}" target="_blank" rel="noopener">🌐 Web</a>`:""}</div>`;
  h+=`<div class="card">
    ${campo("Segmento",e.segmento)}
    ${campo("Provincia",e.provincia)}
    ${campo("Población / polígono",e.localidad)}
    ${e.comarca?campo("Comarca",e.comarca):""}
    ${campo("Web",e.web)}
    ${campo("Email",e.email)}
    ${campo("Teléfono",e.telefono)}
    ${campo("Por qué encaja",e.motivo,true)}
    ${campo("Servicio ofrecido",e.servicio,true)}
    ${campo("Estado",e.estado)}
    ${campo("Fecha de contacto",fecha(e.fechaContacto))}
    ${campo("Notas",e.notas,true)}
  </div>`;
  $("main").innerHTML=h;window.scrollTo(0,0)}
function abrir(id){vista=id;history.pushState({id},"", "?id="+encodeURIComponent(id));pintar()}
$("bAtras").addEventListener("click",e=>{if(!vista)return;e.preventDefault();if(history.state&&history.state.id)history.back();else{vista="";history.replaceState(null,"","/prospeccion/");pintar()}});
window.addEventListener("popstate",()=>{vista=new URLSearchParams(location.search).get("id")||"";pintar()});
$("main").addEventListener("click",e=>{
  const est=e.target.closest("[data-est]");if(est){filtroEst=filtroEst===est.dataset.est?"":est.dataset.est;pintarLista();return}
  const seg=e.target.closest("[data-seg]");if(seg){filtroSeg=seg.dataset.seg;pintarLista();return}
  const prov=e.target.closest("[data-prov]");if(prov){filtroProv=prov.dataset.prov;pintarLista();return}
  const emp=e.target.closest("[data-id]");if(emp&&!vista)abrir(emp.dataset.id)});
$("main").addEventListener("input",e=>{if(e.target.id!=="q")return;busq=e.target.value;const p=e.target.selectionStart;pintarLista();const b=$("q");if(b){b.focus();b.setSelectionRange(p,p)}});
async function cargar(){try{
  const r=await fetch("/data/prospeccion.json");
  if(!r.ok)throw new Error("HTTP "+r.status);
  const d=await r.json();
  L=Array.isArray(d)?d:(d.empresas||[]);
  L=L.filter(e=>e&&e.id&&e.nombre);
  actualizado=Array.isArray(d)?"":(d.actualizado||"");
  vista=new URLSearchParams(location.search).get("id")||"";
  pintar()}
catch(err){$("main").innerHTML=`<div class="vacio">No se han podido cargar las empresas.<br>Comprueba la conexión e inténtalo de nuevo.</div>`}}
cargar();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
</body>
</html>
